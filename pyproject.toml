[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xword"
version = "0.1.0"
description = "Crossword agent: Tavily grounds, Jev ranks, Token Factory writes leftovers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=2.45,<3",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "langsmith>=0.3",
]

[project.optional-dependencies]
web = ["uvicorn>=0.30"]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27", "xword[web]"]

[tool.hatch.build.targets.wheel]
packages = ["src/xword"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py310"
